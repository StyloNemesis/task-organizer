<div id="projectModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Nuevo Proyecto</h3>
      <button class="modal-close">&times;</button>
    </div>
    <div class="modal-body">
      <form id="projectForm">
        <input type="hidden" id="projectId">
        
        <div class="form-group">
          <label for="projectName">Nombre del Proyecto</label>
          <input type="text" id="projectName" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="parentProject">Proyecto Padre (Opcional)</label>
          <select id="parentProject" class="form-control">
            <option value="">-- Ninguno --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="projectColor">Color</label>
          <input type="color" id="projectColor" class="form-control" value="#3b82f6">
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

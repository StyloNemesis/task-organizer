<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto - Task Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script>
    // Apply saved theme immediately to prevent flash
    (function() { var t = localStorage.getItem('app-theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-controls">
      <button class="titlebar-btn" onclick="window.api.windowMinimize()" title="Minimizar">&#8722;</button>
      <button class="titlebar-btn" onclick="window.api.windowMaximize()" title="Maximizar">&#9633;</button>
      <button class="titlebar-btn close" onclick="window.api.windowClose()" title="Cerrar">&#215;</button>
    </div>
  </div>
  <div class="app-container">
    <!-- Sidebar se cargará dinámicamente -->

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <div>
          <a href="projects.html" class="back-link">← Volver a proyectos</a>
          <h2 id="projectTitle">Proyecto</h2>
        </div>
      </header>

      <div class="content-body">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="tasks">Tareas</button>
          <button class="tab-btn" data-tab="notes">Notas</button>
        </div>

        <!-- Tab de Tareas -->
        <div class="tab-content active" id="tasksTab">
          <div class="tab-header">
            <h3>Lista de Tareas</h3>
            <button class="btn btn-primary" id="newTaskBtn">+ Nueva Tarea</button>
          </div>
          
          <div class="tasks-list" id="tasksList">
            <!-- Las tareas se cargarán dinámicamente -->
          </div>
        </div>

        <!-- Tab de Notas -->
        <div class="tab-content" id="notesTab">
          <div class="tab-header">
            <h3>Notas del Proyecto</h3>
            <button class="btn btn-primary" id="newNoteBtn">+ Nueva Nota</button>
          </div>
          
          <div class="notes-list" id="notesList">
            <!-- Las notas se cargarán dinámicamente -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Los modales se cargarán dinámicamente mediante modal-loader.js -->
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/modal-loader.js"></script>
  <script>
    // Cargar modales de forma síncrona ANTES de cargar otros scripts
    window.initModals(['taskEdit', 'taskView', 'imageViewer', 'note']);
  </script>
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/external-links.js"></script>
  <script src="js/modal-resize.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/notes.js"></script>
  <script>
    // Obtener el ID del proyecto de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    
    if (!projectId) {
      window.location.href = 'projects.html';
    }
  </script>
</body>
</html>

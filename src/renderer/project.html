<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto - Task Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar se cargará dinámicamente -->

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <div>
          <a href="projects.html" class="back-link">← Volver a proyectos</a>
          <h2 id="projectTitle">Proyecto</h2>
        </div>
      </header>

      <div class="content-body">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="tasks">Tareas</button>
          <button class="tab-btn" data-tab="notes">Notas</button>
        </div>

        <!-- Tab de Tareas -->
        <div class="tab-content active" id="tasksTab">
          <div class="tab-header">
            <h3>Lista de Tareas</h3>
            <button class="btn btn-primary" id="newTaskBtn">+ Nueva Tarea</button>
          </div>
          
          <div class="tasks-list" id="tasksList">
            <!-- Las tareas se cargarán dinámicamente -->
          </div>
        </div>

        <!-- Tab de Notas -->
        <div class="tab-content" id="notesTab">
          <div class="tab-header">
            <h3>Notas del Proyecto</h3>
            <button class="btn btn-primary" id="newNoteBtn">+ Nueva Nota</button>
          </div>
          
          <div class="notes-list" id="notesList">
            <!-- Las notas se cargarán dinámicamente -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal para visualizar tarea (solo lectura) -->
  <div id="taskViewModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="taskViewTitle">Detalles de la Tarea</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <div>
            <h4 id="viewTaskTitle" style="margin: 0; color: var(--text-primary);"></h4>
          </div>
          
          <div id="viewTaskDescriptionContainer" style="display: none;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Descripción</label>
            <div id="viewTaskDescription" class="markdown-content" style="background: var(--bg-secondary); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border-color);"></div>
          </div>
          
          <div class="form-row">
            <div>
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Estado</label>
              <span id="viewTaskStatus"></span>
            </div>
            
            <div>
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Criticidad</label>
              <span id="viewTaskCriticality"></span>
            </div>
          </div>
          
          <div class="form-row">
            <div id="viewTaskCreatedContainer">
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Fecha de Creación</label>
              <span id="viewTaskCreated"></span>
            </div>
            
            <div id="viewTaskDueDateContainer" style="display: none;">
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Fecha de Ejecución</label>
              <span id="viewTaskDueDate"></span>
            </div>
          </div>
          
          <div id="viewTaskTagsContainer" style="display: none;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Tags</label>
            <div id="viewTaskTags" style="display: flex; gap: 0.5rem; flex-wrap: wrap;"></div>
          </div>
          
          <div id="viewTaskImagesContainer" style="display: none;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Imágenes</label>
            <div id="viewTaskImages" class="task-images"></div>
          </div>
        </div>
        
        <div class="form-actions" style="margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary modal-close-btn">Cerrar</button>
          <button type="button" class="btn btn-primary" id="editFromViewBtn">Editar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para crear/editar tarea -->
  <div id="taskModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="taskModalTitle">Nueva Tarea</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <input type="hidden" id="taskId">
          
          <div class="form-group">
            <label for="taskTitle">Título</label>
            <input type="text" id="taskTitle" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="taskDescription">
              Descripción
              <button type="button" class="btn btn-sm btn-secondary" id="toggleTaskPreview" style="float: right;">Vista previa</button>
            </label>
            <textarea id="taskDescription" class="form-control" rows="4"></textarea>
            <div id="taskDescriptionPreview" class="markdown-preview markdown-content" style="display: none;"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="taskDueDate">Fecha de Ejecución</label>
              <input type="date" id="taskDueDate" class="form-control">
            </div>

            <div class="form-group">
              <label for="taskCriticality">Criticidad</label>
              <select id="taskCriticality" class="form-control">
                <option value="low">Baja</option>
                <option value="medium" selected>Media</option>
                <option value="high">Alta</option>
                <option value="critical">Crítica</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="taskStatus">Estado</label>
            <select id="taskStatus" class="form-control">
              <option value="pending">Pendiente</option>
              <option value="in_progress">En Curso</option>
              <option value="testing">Testing</option>
              <option value="completed">Completada</option>
            </select>
          </div>

          <div class="form-group">
            <label>Imágenes</label>
            <div class="image-upload-area" id="imageUploadArea">
              <input type="file" id="taskImages" accept="image/*" multiple style="display: none;">
              <button type="button" class="btn btn-secondary" id="addImageBtn">+ Añadir Imágenes</button>
              <div class="images-preview" id="imagesPreview"></div>
            </div>
          </div>

          <div class="form-group">
            <label>Tags</label>
            <div class="tags-selector">
              <!-- Los tags se cargarán dinámicamente desde config.js -->
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para crear/editar nota -->
  <div id="noteModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="noteModalTitle">Nueva Nota</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="noteForm">
          <input type="hidden" id="noteId">
          
          <div class="form-group">
            <label for="noteTitle">Título</label>
            <input type="text" id="noteTitle" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="noteContent">
              Contenido (Markdown soportado)
              <button type="button" class="btn btn-sm btn-secondary" id="toggleNotePreview" style="float: right;">Vista previa</button>
            </label>
            <textarea id="noteContent" class="form-control" rows="10"></textarea>
            <div id="noteContentPreview" class="markdown-preview markdown-content" style="display: none;"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal para visualizar imagen -->
  <div id="imageViewerModal" class="modal">
    <div class="modal-content modal-large" style="max-width: 90vw; max-height: 90vh;">
      <div class="modal-header">
        <h3>Imagen</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" style="text-align: center; padding: 1rem;">
        <img id="imageViewerImg" src="" alt="Imagen" style="max-width: 100%; max-height: 70vh; object-fit: contain;">
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/notes.js"></script>
  <script>
    // Obtener el ID del proyecto de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = urlParams.get('id');
    
    if (!projectId) {
      window.location.href = 'projects.html';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Task Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar se cargará dinámicamente -->

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <h2>Dashboard de Tareas</h2>
        <div class="header-actions">
          <select id="filterMainProject" class="form-control">
            <option value="">Todos los proyectos</option>
          </select>
          <select id="filterSubProject" class="form-control">
            <option value="">Todas las subcategorías</option>
          </select>
          <select id="filterStatus" class="form-control">
            <option value="">Todos los estados</option>
            <option value="pending">Pendiente</option>
            <option value="in_progress">En Curso</option>
            <option value="testing">Testing</option>
            <option value="completed">Completada</option>
          </select>
          <select id="filterCriticality" class="form-control">
            <option value="">Todas las criticidades</option>
            <option value="low">Baja</option>
            <option value="medium">Media</option>
            <option value="high">Alta</option>
            <option value="critical">Crítica</option>
          </select>
          <input type="search" id="searchTasks" placeholder="Buscar tareas..." class="search-input">
        </div>
      </header>

      <div class="content-body">
        <!-- Estadísticas rápidas -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="totalTasks">0</div>
            <div class="stat-label">Total Tareas</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="completedTasks">0</div>
            <div class="stat-label">Completadas</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="pendingTasks">0</div>
            <div class="stat-label">Pendientes</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="criticalTasks">0</div>
            <div class="stat-label">Críticas</div>
          </div>
        </div>

        <!-- Tabla de tareas -->
        <div class="table-container">
          <table class="tasks-table" id="tasksTable">
            <thead>
              <tr>
                <th class="sortable" data-column="completed">Estado</th>
                <th class="sortable" data-column="title">Título</th>
                <th class="sortable" data-column="parent_project_name">Proyecto Principal</th>
                <th class="sortable" data-column="project_name">Subcategoría</th>
                <th class="sortable" data-column="criticality">Criticidad</th>
                <th class="sortable" data-column="created_at">Fecha Creación</th>
                <th class="sortable" data-column="due_date">Fecha Ejecución</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody">
              <!-- Las tareas se cargarán dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal para editar tarea -->
  <div id="taskModal" class="modal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h3 id="taskModalTitle">Editar Tarea</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
          <input type="hidden" id="taskId">
          <input type="hidden" id="taskProjectId">
          
          <div class="form-group">
            <label for="taskTitle">Título</label>
            <input type="text" id="taskTitle" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="taskDescription">Descripción</label>
            <textarea id="taskDescription" class="form-control" rows="4"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="taskDueDate">Fecha de Ejecución</label>
              <input type="date" id="taskDueDate" class="form-control">
            </div>

            <div class="form-group">
              <label for="taskCriticality">Criticidad</label>
              <select id="taskCriticality" class="form-control">
                <option value="low">Baja</option>
                <option value="medium" selected>Media</option>
                <option value="high">Alta</option>
                <option value="critical">Crítica</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="taskStatus">Estado</label>
            <select id="taskStatus" class="form-control">
              <option value="pending">Pendiente</option>
              <option value="in_progress">En Curso</option>
              <option value="testing">Testing</option>
              <option value="completed">Completada</option>
            </select>
          </div>

          <div class="form-group">
            <label>Tags</label>
            <div class="tags-selector" id="tagsSelector">
              <!-- Los tags se cargarán dinámicamente -->
            </div>
          </div>

          <div class="form-group">
            <label>Imágenes</label>
            <div class="image-upload-area" id="imageUploadArea">
              <input type="file" id="taskImages" accept="image/*" multiple style="display: none;">
              <button type="button" class="btn btn-secondary" id="addImageBtn">+ Añadir Imágenes</button>
              <div class="images-preview" id="imagesPreview"></div>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary modal-close-btn">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Task Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script>
    // Apply saved theme immediately to prevent flash
    (function() { var t = localStorage.getItem('app-theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar se cargará dinámicamente -->

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <h2>Dashboard de Tareas</h2>
        <div class="header-actions">
          <select id="filterMainProject" class="form-control">
            <option value="">Todos los proyectos</option>
          </select>
          <select id="filterSubProject" class="form-control">
            <option value="">Todas las subcategorías</option>
          </select>
          <select id="filterStatus" class="form-control">
            <option value="">Todos los estados</option>
            <option value="pending">Pendiente</option>
            <option value="in_progress">En Curso</option>
            <option value="testing">Testing</option>
            <option value="completed">Completada</option>
          </select>
          <select id="filterCriticality" class="form-control">
            <option value="">Todas las criticidades</option>
            <option value="low">Baja</option>
            <option value="medium">Media</option>
            <option value="high">Alta</option>
            <option value="critical">Crítica</option>
          </select>
          <input type="search" id="searchTasks" placeholder="Buscar tareas..." class="search-input">
          <button class="btn btn-primary" id="newTaskBtn" style="margin-left: auto;">+ Nueva Tarea</button>
        </div>
      </header>

      <div class="content-body">
        <!-- Estadísticas rápidas -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="totalTasks">0</div>
            <div class="stat-label">Total Tareas</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="completedTasks">0</div>
            <div class="stat-label">Completadas</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="pendingTasks">0</div>
            <div class="stat-label">Pendientes</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="criticalTasks">0</div>
            <div class="stat-label">Críticas</div>
          </div>
        </div>

        <!-- Tabla de tareas -->
        <div class="table-container">
          <table class="tasks-table" id="tasksTable">
            <thead>
              <tr>
                <th class="sortable" data-column="completed">Estado</th>
                <th class="sortable" data-column="title">Título</th>
                <th class="sortable" data-column="parent_project_name">Proyecto Principal</th>
                <th class="sortable" data-column="project_name">Subcategoría</th>
                <th class="sortable" data-column="criticality">Criticidad</th>
                <th class="sortable" data-column="created_at">Fecha Creación</th>
                <th class="sortable" data-column="due_date">Fecha Ejecución</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody">
              <!-- Las tareas se cargarán dinámicamente -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Los modales se cargarán dinámicamente mediante modal-loader.js -->
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="js/modal-loader.js"></script>
  <script>
    // Cargar modales de forma síncrona ANTES de cargar otros scripts
    window.initModals(['taskEdit', 'taskView', 'imageViewer']);
  </script>
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/external-links.js"></script>
  <script src="js/modal-resize.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración - Task Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved theme immediately to prevent flash
    (function() { var t = localStorage.getItem('app-theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-controls">
      <button class="titlebar-btn" onclick="window.api.windowMinimize()" title="Minimizar">&#8722;</button>
      <button class="titlebar-btn" onclick="window.api.windowMaximize()" title="Maximizar">&#9633;</button>
      <button class="titlebar-btn close" onclick="window.api.windowClose()" title="Cerrar">&#215;</button>
    </div>
  </div>
  <div class="app-container">
    <!-- Sidebar se cargará dinámicamente -->

    <main class="main-content">
      <header class="content-header">
        <h2>Configuración</h2>
        <p style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
          Elige el tema visual de la aplicación
        </p>
      </header>

      <div class="content-body">

        <div class="themes-section">
          <h3 class="themes-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Temas Claros
          </h3>
          <div class="themes-grid" id="lightThemesGrid"></div>
        </div>

        <div class="themes-section">
          <h3 class="themes-section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Temas Oscuros
          </h3>
          <div class="themes-grid" id="darkThemesGrid"></div>
        </div>

        <div class="themes-section">
          <h3 class="themes-section-title">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0"><path d="M13.5 8.34L8.5 13.5C8.23 13.77 7.87 13.91 7.5 13.91C7.12 13.91 6.76 13.77 6.49 13.5L1.33 8.33C1.07 8.07 0.92 7.71 0.92 7.33V2.16C0.92 1.43 1.51 0.83 2.25 0.83H7.41C7.79 0.83 8.15 0.98 8.42 1.25L13.5 6.33C13.77 6.6 13.91 6.96 13.91 7.34C13.91 7.71 13.77 8.07 13.5 8.34Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.5" cy="4.5" r="1" fill="currentColor"/></svg>
            Tags
          </h3>
          <p style="color:var(--text-secondary);font-size:0.875rem;margin-bottom:1rem;">
            Añade o elimina tags para categorizar tus tareas. Los cambios se aplican inmediatamente en toda la aplicación.
          </p>

          <div id="tagsManagerList" class="tag-manager-list"></div>

          <div class="tag-manager-form">
            <input type="text" id="newTagName" class="form-control" placeholder="Nombre del tag" maxlength="30" style="flex:1;min-width:140px;">
            <input type="color" id="newTagColor" value="#6366f1" class="tag-manager-color-input" title="Color del tag">
            <button class="btn btn-primary" onclick="window._addTag()">+ Añadir</button>
            <button class="btn btn-secondary" onclick="window._resetTags()" title="Restaurar tags por defecto">Restaurar</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/external-links.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/tags-manager.js"></script>
</body>
</html>

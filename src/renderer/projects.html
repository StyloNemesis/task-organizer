<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos - Task Organizer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar se cargará dinámicamente -->

    <!-- Main Content -->
    <main class="main-content">
      <header class="content-header">
        <h2>Mis Proyectos</h2>
        <div class="header-actions">
          <input type="search" id="searchProjects" placeholder="Buscar proyectos..." class="search-input">
          <button class="btn btn-primary" id="newProjectBtn" style="margin-left: auto;">+ Nuevo Proyecto</button>
        </div>
      </header>

      <div class="content-body">
        <div class="projects-grid" id="projectsGrid">
          <!-- Los proyectos se cargarán dinámicamente -->
        </div>
      </div>
    </main>
  </div>

  <!-- Los modales se cargarán dinámicamente mediante modal-loader.js -->
  
  <script src="js/modal-loader.js"></script>
  <script>
    // Cargar modales de forma síncrona ANTES de cargar otros scripts
    window.initModals(['project']);
  </script>
  <script src="js/icons.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/external-links.js"></script>
  <script src="js/modal-resize.js"></script>
  <script src="js/projects.js"></script>
</body>
</html>

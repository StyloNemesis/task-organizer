name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set version
        id: set_version
        run: |
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          else
            echo "Version already set to ${{ inputs.version }}"
          fi

      - name: Commit version change
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if git diff --quiet package.json package-lock.json; then
            echo "No version changes to commit"
          else
            git add package.json package-lock.json
            git commit -m "chore: bump version to ${{ inputs.version }}"
            git push
          fi

      - name: Create Git Tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ inputs.version }}"; then
            echo "Tag v${{ inputs.version }} already exists remotely"
            git fetch --tags
          else
            git tag v${{ inputs.version }}
            git push origin v${{ inputs.version }}
          fi

      - name: Create Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verificar si la release ya existe
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ inputs.version }} already exists"
            UPLOAD_URL=$(gh api repos/${{ github.repository }}/releases/tags/v${{ inputs.version }} --jq '.upload_url')
          else
            # Crear la release
            gh release create "v${{ inputs.version }}" \
              --title "Task Organizer v${{ inputs.version }}" \
              --notes "## Task Organizer v${{ inputs.version }}
            
            ### 📦 Instaladores Disponibles
            
            #### Linux
            - **AppImage** - Compatible con todas las distribuciones
            - **DEB** - Para Debian/Ubuntu
            - **RPM** - Para Fedora/RHEL/CentOS
            
            #### Windows
            - **Setup.exe** - Instalador con asistente
            - **Portable.exe** - Versión portable sin instalación
            
            #### macOS
            - **DMG** - Instalador para macOS
            - **ZIP** - Aplicación comprimida
            
            ### 📝 Cambios
            
            _Edita esta sección para agregar las notas de la versión_"
            
            UPLOAD_URL=$(gh api repos/${{ github.repository }}/releases/tags/v${{ inputs.version }} --jq '.upload_url')
          fi
          
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux:all -- --publish never

      - name: Upload Linux Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Subir AppImage
          if [ -f "installers/Task Organizer-${{ needs.create-release.outputs.version }}.AppImage" ]; then
            gh release upload "v${{ needs.create-release.outputs.version }}" \
              "installers/Task Organizer-${{ needs.create-release.outputs.version }}.AppImage" \
              --clobber
          fi
          
          # Subir DEB
          if [ -f "installers/task-organizer_${{ needs.create-release.outputs.version }}_amd64.deb" ]; then
            gh release upload "v${{ needs.create-release.outputs.version }}" \
              "installers/task-organizer_${{ needs.create-release.outputs.version }}_amd64.deb" \
              --clobber
          fi
          
          # Subir RPM (si existe)
          if [ -f "installers/task-organizer-${{ needs.create-release.outputs.version }}.x86_64.rpm" ]; then
            gh release upload "v${{ needs.create-release.outputs.version }}" \
              "installers/task-organizer-${{ needs.create-release.outputs.version }}.x86_64.rpm" \
              --clobber
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win -- --publish never

      - name: Upload Windows Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Buscar y subir Setup
          SETUP_FILE=$(find installers -name "*Setup*.exe" -type f 2>/dev/null | head -1)
          if [ -n "$SETUP_FILE" ]; then
            echo "Uploading: $SETUP_FILE"
            gh release upload "v${{ needs.create-release.outputs.version }}" "$SETUP_FILE" --clobber
          fi
          
          # Buscar y subir Portable
          PORTABLE_FILE=$(find installers -name "*.exe" -type f ! -name "*Setup*" 2>/dev/null | head -1)
          if [ -n "$PORTABLE_FILE" ]; then
            echo "Uploading: $PORTABLE_FILE"
            gh release upload "v${{ needs.create-release.outputs.version }}" "$PORTABLE_FILE" --clobber
          fi

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run build:mac -- --publish never

      - name: Upload macOS Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Buscar y subir DMG
          DMG_FILE=$(find installers -name "*.dmg" -type f 2>/dev/null | head -1)
          if [ -n "$DMG_FILE" ]; then
            echo "Uploading: $DMG_FILE"
            gh release upload "v${{ needs.create-release.outputs.version }}" "$DMG_FILE" --clobber
          fi
          
          # Buscar y subir ZIP
          ZIP_FILE=$(find installers -name "*.zip" -type f 2>/dev/null | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Uploading: $ZIP_FILE"
            gh release upload "v${{ needs.create-release.outputs.version }}" "$ZIP_FILE" --clobber
          fi

name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej: 1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set version
        id: set_version
        run: |
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          npm version ${{ inputs.version }} --no-git-tag-version

      - name: Commit version change
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ inputs.version }}"
          git push

      - name: Create Git Tag
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version }}
          release_name: Task Organizer v${{ inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Task Organizer v${{ inputs.version }}
            
            ### 📦 Instaladores Disponibles
            
            #### Linux
            - **AppImage** - Compatible con todas las distribuciones
            - **DEB** - Para Debian/Ubuntu
            - **RPM** - Para Fedora/RHEL/CentOS
            
            #### Windows
            - **Setup.exe** - Instalador con asistente
            - **Portable.exe** - Versión portable sin instalación
            
            #### macOS
            - **DMG** - Instalador para macOS
            - **ZIP** - Aplicación comprimida
            
            ### 📝 Cambios
            
            _Edita esta sección para agregar las notas de la versión_

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Linux
        run: npm run build:linux:all

      - name: Upload AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./installers/Task Organizer-${{ needs.create-release.outputs.version }}.AppImage
          asset_name: Task-Organizer-${{ needs.create-release.outputs.version }}.AppImage
          asset_content_type: application/octet-stream

      - name: Upload DEB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./installers/task-organizer_${{ needs.create-release.outputs.version }}_amd64.deb
          asset_name: task-organizer_${{ needs.create-release.outputs.version }}_amd64.deb
          asset_content_type: application/vnd.debian.binary-package

      - name: Upload RPM (if exists)
        continue-on-error: true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./installers/task-organizer-${{ needs.create-release.outputs.version }}.x86_64.rpm
          asset_name: task-organizer-${{ needs.create-release.outputs.version }}.x86_64.rpm
          asset_content_type: application/x-rpm

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build:win

      - name: Find Setup file
        id: find_setup
        shell: bash
        run: |
          SETUP_FILE=$(ls installers/*Setup*.exe 2>/dev/null | head -1)
          echo "setup_file=$SETUP_FILE" >> $GITHUB_OUTPUT
          echo "Setup file: $SETUP_FILE"

      - name: Find Portable file
        id: find_portable
        shell: bash
        run: |
          PORTABLE_FILE=$(ls installers/*.exe 2>/dev/null | grep -v "Setup" | head -1)
          echo "portable_file=$PORTABLE_FILE" >> $GITHUB_OUTPUT
          echo "Portable file: $PORTABLE_FILE"

      - name: Upload Windows Setup
        if: steps.find_setup.outputs.setup_file != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_setup.outputs.setup_file }}
          asset_name: Task-Organizer-Setup-${{ needs.create-release.outputs.version }}.exe
          asset_content_type: application/x-msdownload

      - name: Upload Windows Portable
        if: steps.find_portable.outputs.portable_file != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_portable.outputs.portable_file }}
          asset_name: Task-Organizer-Portable-${{ needs.create-release.outputs.version }}.exe
          asset_content_type: application/x-msdownload

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.create-release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS
        run: npm run build:mac

      - name: Find DMG file
        id: find_dmg
        run: |
          DMG_FILE=$(ls installers/*.dmg 2>/dev/null | head -1)
          echo "dmg_file=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "DMG file: $DMG_FILE"

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(ls installers/*.zip 2>/dev/null | head -1)
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "ZIP file: $ZIP_FILE"

      - name: Upload macOS DMG
        if: steps.find_dmg.outputs.dmg_file != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_dmg.outputs.dmg_file }}
          asset_name: Task-Organizer-${{ needs.create-release.outputs.version }}.dmg
          asset_content_type: application/x-apple-diskimage

      - name: Upload macOS ZIP
        if: steps.find_zip.outputs.zip_file != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.find_zip.outputs.zip_file }}
          asset_name: Task-Organizer-${{ needs.create-release.outputs.version }}-mac.zip
          asset_content_type: application/zip
